services:
  delta-recovery:
    build: .
    image: delta-recovery-analyzer:latest
    container_name: delta-recovery-analyzer
    ports:
      - "8000:8000"
    environment:
      # 内置样例目录（容器内路径）；可通过挂载覆盖
      SAMPLE_ROOT: /srv/samples
      # 补传 SQLite 库（版号 + 日汇总在同一事务提交）
      BACKFILL_DB: /srv/data/backfill.db
    volumes:
      # 把宿主任意 Delta 表目录挂进来，便于用样例之外的真实留存材料验证
      - ./samples:/srv/samples:ro
      # 补传库持久化到宿主目录，容器重建后已提交版号与汇总不丢
      - ./data:/srv/data
    restart: unless-stopped
